    <!-- Fresca (all headings/display text) + Roboto (body text) are the
         only two families this site actually renders — every other weight

         `display=optional` (not `swap`) is deliberate: the previous `swap`
         setup was the single largest cause of layout shift on this page —
         Lighthouse measured ~0.6 CLS from the footer's text reflowing when
         these fonts finished loading and replaced the fallback font.
         `optional` tells the browser to use the web font only if it's
         already cached or arrives within ~100ms, and otherwise keep the
         fallback for the rest of this page view — trading "some first-time
         visitors briefly see the fallback font" for "this layout shift
         never happens." The stylesheet load itself is also non-blocking
         (the standard preload-then-swap pattern below) — safe to do *because*
         of `optional` above: whether this finishes before or after first
         paint no longer affects CLS either way, so there's no reason to make
         the page wait for it. -->
